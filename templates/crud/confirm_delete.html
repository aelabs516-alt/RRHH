{% extends 'base.html' %}

{% block title %}Confirmar Eliminación{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card shadow-sm" style="border-color: #dc3545;">
            <div class="card-body text-center p-5">
                <i class="fas fa-exclamation-triangle text-danger fa-4x mb-4"></i>
                <h4 class="mb-3">¿Estás seguro que deseas eliminar este registro?</h4>
                <p class="text-muted mb-4 fs-5">{{ object }}</p>
                
                <form method="post">
                    {% csrf_token %}
                    <a href="javascript:history.back()" class="btn btn-secondary px-4">Cancelar</a>
                    <button type="submit" class="btn btn-danger px-4 ms-2">
                        <i class="fas fa-trash"></i> Sí, Eliminar
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Marcar Asistencia{% endblock %}

{% block extra_head %}
<style>
    .camera-container {
        position: relative;
        width: 100%;
        max-width: 500px;
        aspect-ratio: 5 / 4;
        margin: 0 auto;
        border: 2px solid #ccc;
        border-radius: 8px;
        overflow: hidden;
        background: #000;
    }
    #video { 
        width: 100%; 
        height: 100%;
        object-fit: cover;
        display: block; 
    }
    /* Silueta centrada en la cámara */
    .silhouette {
        position: absolute;
        top: 10%;
        left: 25%;
        width: 50%;
        height: 70%;
        border: 3px dashed rgba(255, 255, 255, 0.7);
        border-radius: 50% 50% 40% 40%;
        pointer-events: none;
    }
    #canvas { display: none; }
</style>
{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12 text-center">
        <h3 class="mb-4">Registro de Asistencia</h3>
        
        <div id="alertBox" class="alert d-none"></div>

        <div class="camera-container mb-3">
            <video id="video" autoplay playsinline></video>
            <div class="silhouette"></div>
            <canvas id="canvas"></canvas>
        </div>

        <div class="mb-3 d-flex justify-content-center gap-3">
            <div class="form-check">
                <input class="form-check-input" type="radio" name="actionType" id="ingreso" value="ingreso" checked>
                <label class="form-check-label" for="ingreso">Ingreso</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="actionType" id="salida" value="salida">
                <label class="form-check-label" for="salida">Salida</label>
            </div>
        </div>

        <div class="mb-3 w-50 mx-auto text-start" id="obsContainer" style="display: none;">
            <div class="alert alert-warning mb-2" id="obsMessage">Justificación requerida</div>
            <label class="form-label fw-bold">Motivo</label>
            <select id="justification" class="form-select mb-2">
                <option value="NORMAL" selected disabled>Seleccione un motivo...</option>
                <optgroup label="Permisos Remunerados (No descuentan tiempo)">
                    <option value="CITA_MEDICA">Cita médica</option>
                    <option value="ELECCIONES">Elecciones / Jurado</option>
                    <option value="CALAMIDAD">Calamidad</option>
                    <option value="ESCOLAR">Obligaciones escolares</option>
                    <option value="JUDICIAL">Citas Judiciales</option>
                    <option value="LUTO">Luto</option>
                    <option value="ENFERMEDAD">Enfermedad General</option>
                </optgroup>
                <optgroup label="Permisos NO Remunerados (Descuentan tiempo)">
                    <option value="PERSONAL">Asuntos personales</option>
                    <option value="OTROS">Otros / Ingresar texto</option>
                </optgroup>
            </select>
            
            <div id="textObsContainer" style="display:none;">
                <label class="form-label fw-bold">Describa el motivo</label>
                <textarea id="observations" class="form-control" rows="2" placeholder="Escriba aquí..."></textarea>
            </div>
        </div>

        <button id="snapBtn" class="btn btn-success btn-lg" disabled>Iniciando sensores...</button>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const snapBtn = document.getElementById('snapBtn');
    const alertBox = document.getElementById('alertBox');
    const actionRadios = document.getElementsByName('actionType');
    const obsContainer = document.getElementById('obsContainer');
    const obsInput = document.getElementById('observations');
    const justInput = document.getElementById('justification');
    const textObsContainer = document.getElementById('textObsContainer');
    const obsMessage = document.getElementById('obsMessage');

    justInput.addEventListener('change', function() {
        if(this.value === 'OTROS' || this.value === 'PERSONAL') {
            textObsContainer.style.display = 'block';
        } else {
            textObsContainer.style.display = 'none';
        }
    });

    // Variables de sensores
    let currentLat = null;
    let currentLng = null;
    let cameraReady = false;
    let locationReady = false;

    function checkSensors() {
        if (cameraReady && locationReady) {
            snapBtn.disabled = false;
            snapBtn.innerText = 'Capturar y Marcar';
            alertBox.classList.add('d-none');
        } else {
            snapBtn.disabled = true;
            snapBtn.innerText = 'Permita Cámara y Ubicación...';
            
            alertBox.classList.remove('d-none');
            alertBox.className = 'alert alert-danger';
            
            let msg = "Para marcar asistencia DEBE permitir los accesos:<br>";
            if (!cameraReady) msg += "- Acceso a la cámara no detectado o denegado.<br>";
            if (!locationReady) msg += "- Acceso a la ubicación (GPS) no detectado o denegado.";
            alertBox.innerHTML = msg;
        }
    }

    // Inicializar Cámara
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
        .then(stream => { 
            video.srcObject = stream; 
            cameraReady = true;
            checkSensors();
        })
        .catch(err => {
            console.error("Error cámara:", err);
            cameraReady = false;
            checkSensors();
        });

    // Inicializar Geolocalización
    if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
            (position) => {
                currentLat = position.coords.latitude;
                currentLng = position.coords.longitude;
                locationReady = true;
                checkSensors();
            },
            (err) => {
                console.warn("No se pudo obtener la ubicación: ", err);
                locationReady = false;
                checkSensors();
            },
            { enableHighAccuracy: true, maximumAge: 0 }
        );
    } else {
        console.warn("Geolocalización no soportada por el navegador");
        locationReady = false;
        checkSensors();
    }

    function showAlert(msg, isError=false) {
        alertBox.innerText = msg;
        alertBox.className = 'alert ' + (isError ? 'alert-danger' : 'alert-success');
        alertBox.classList.remove('d-none');
    }

    // Toggle campo observaciones
    actionRadios.forEach(radio => {
        radio.addEventListener('change', (e) => {
            if (e.target.value === 'salida') {
                obsContainer.style.display = 'block';
            } else {
                obsContainer.style.display = 'none';
                obsInput.value = '';
                justInput.value = 'NORMAL';
                obsContainer.style.display = 'none';
                textObsContainer.style.display = 'none';
            }
        });
    });

    // Capturar foto y enviar
    snapBtn.addEventListener('click', () => {
        // Doble verificación de seguridad
        if (!cameraReady || !locationReady || currentLat === null || currentLng === null) {
            showAlert("Es obligatorio permitir el acceso a su cámara y ubicación para marcar asistencia.", true);
            return;
        }

        const action = document.querySelector('input[name="actionType"]:checked').value;
        const observations = obsInput.value;
        const justification = justInput.value;

        // Configurar canvas a una proporción 5:4 exacta
        const targetRatio = 5 / 4;
        
        // Determinar dimensiones de recorte (crop) basadas en el video real
        let sourceWidth = video.videoWidth;
        let sourceHeight = video.videoHeight;
        let sourceX = 0;
        let sourceY = 0;
        
        const videoRatio = sourceWidth / sourceHeight;
        
        if (videoRatio > targetRatio) {
            // El video es más ancho que 5:4 (ej. 16:9)
            let newWidth = sourceHeight * targetRatio;
            sourceX = (sourceWidth - newWidth) / 2;
            sourceWidth = newWidth;
        } else if (videoRatio < targetRatio) {
            // El video es más alto que 5:4 (ej. orientación vertical en móvil)
            let newHeight = sourceWidth / targetRatio;
            sourceY = (sourceHeight - newHeight) / 2;
            sourceHeight = newHeight;
        }
        
        // Fijar dimensiones del canvas para la foto resultante (Comprimido)
        canvas.width = 320; 
        canvas.height = canvas.width / targetRatio; // 320x256
        
        const context = canvas.getContext('2d');
        // Dibujar solo la porción 5:4 del video (simulando object-fit: cover)
        context.drawImage(video, sourceX, sourceY, sourceWidth, sourceHeight, 0, 0, canvas.width, canvas.height);
        
        // Agregar Marca de Agua (Fecha y Hora)
        const now = new Date();
        const dateTimeStr = now.toLocaleDateString() + ' ' + now.toLocaleTimeString();
        
        context.fillStyle = "rgba(0, 0, 0, 0.5)";
        context.fillRect(0, canvas.height - 30, canvas.width, 30);
        
        context.font = "14px Arial";
        context.fillStyle = "white";
        context.textAlign = "right";
        context.fillText(dateTimeStr, canvas.width - 10, canvas.height - 10);
        
        // Obtener Base64 con alta compresión (0.5 = 50% calidad JPEG)
        const photoData = canvas.toDataURL('image/jpeg', 0.5);

        snapBtn.disabled = true;
        snapBtn.innerText = 'Procesando...';

        fetch("{% url 'attendance:process_api' %}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({
                action: action,
                photo: photoData,
                observations: observations,
                justification: justification,
                lat: currentLat,
                lng: currentLng
            })
        })
        .then(res => res.json())
        .then(data => {
            if(data.status === 'success') {
                showAlert(data.message, false);
                obsInput.value = '';
                justInput.value = 'NORMAL';
                obsContainer.style.display = 'none';
                textObsContainer.style.display = 'none';
            } else {
                showAlert(data.message, true);
                if(data.require_justification) {
                    obsMessage.innerText = data.message;
                    obsContainer.style.display = 'block';
                    justInput.focus();
                }
            }
        })
        .catch(err => {
            showAlert('Error de conexión', true);
        })
        .finally(() => {
            snapBtn.disabled = false;
            snapBtn.innerText = 'Capturar y Marcar';
        });
    });
</script>
{% endblock %}
